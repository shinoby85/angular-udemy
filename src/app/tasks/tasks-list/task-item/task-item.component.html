<article
  [class]="{
    'status-open': task().status === 'OPEN',
    'status-in-progress': task().status === 'IN-PROGRESS',
    'status-done': task().status === 'DONE'
  }"
>
  <header>
    <h3>{{ task().title }}</h3>
    <p>{{ taskStatus() }}</p>
  </header>
  <p>{{ task().description }}</p>
  <form (ngSubmit)="onChangeTaskStatus(task().id, status.value)">
    <select #status>
      @for (option of taskStatusOption; track option.value) {
        <option [selected]="task().status === option.taskStatus" [value]="option.value">{{ option.text }}</option>
      }
    </select>
    <p>
      <button>Change Status</button>
    </p>
  </form>
</article>
