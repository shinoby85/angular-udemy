<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <div class="navbar-header">
      <a class="navbar-brand" routerLink="/">Recipe Book</a>
    </div>

    <div class="collapse navbar-collapse">
      <ul class="nav navbar-nav me-auto">
        @if (isAuthenticated) {
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" routerLink="/recipes">Recipes</a>
          </li>
        }
        @if (!isAuthenticated) {
          <li class="nav-item" routerLinkActive="active">
            <a class="nav-link" routerLink="/auth">Authenticate</a>
          </li>
        }
        <li class="nav-item" routerLinkActive="active">
          <a class="nav-link" routerLink="/shopping-list">Shopping List</a>
        </li>
      </ul>
      @if (isAuthenticated) {
        <ul class="nav navbar-nav navbar-right">
          <li class="nav-item">
            <a class="nav-link" style="cursor: pointer" (click)="onLogout()">Logout</a>
          </li>
          <li class="dropdown">
            <a aria-expanded="false" class="nav-link dropdown-toggle"
               data-bs-toggle="dropdown"
               id="dropdownMenuButton"
               role="button" style="cursor: pointer;"
            >Manage <span class="caret"></span
            ></a>
            <ul aria-labelledby="dropdownMenuButton" class="dropdown-menu">
              <li>
                <a (click)="onSaveData()" class="dropdown-item" style="cursor: pointer;">Save Data</a>
              </li>
              <li>
                <a (click)="onFetchData()" class="dropdown-item" style="cursor: pointer;">Fetch Data</a>
              </li>
            </ul>

          </li>
        </ul>
      }
    </div>
  </div>
</nav>
