<form #form (ngSubmit)="onSubmit(inputElement.value, textElement.value)" id="new-ticket">
  <app-control label="Title">
    <input #input #inputElement id="title" name="title" type="text"/>
  </app-control>
  <app-control label="Request">
    <textarea #input #textElement id="request" name="request" rows="3"> </textarea>
  </app-control>
  <p>
    <button appButton>
      Submit
      <span ngProjectAs="icon">➤</span>
    </button>
  </p>
</form>
