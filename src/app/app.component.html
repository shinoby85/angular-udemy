<app-header/>
<main>
  <ul *ngIf="users" id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user (select)="onSelectUser($event)" [user]="user" [selected]="selectedUser?.id === user.id"/>
      </li>
    }
  </ul>
  @if (selectedUser) {
    <app-tasks [user]="selectedUser"></app-tasks>
  } @else {
    <p id="fallback">Select a user to see their tasks!</p>
  }
</main>
