<app-header/>
<main>
  <ul *ngIf="users" id="users">
    @for (user of users; track user.id) {
      <li>
        <app-user (select)="onSelectUser($event)" [user]="user"/>
      </li>
    }
  </ul>
  @if (selectedUserName) {
    <app-tasks [name]="selectedUserName"></app-tasks>
  } @else {
    <p id="fallback">Select a user to see their tasks!</p>
  }
</main>
